# Amintirile Gantera: o dată pe oră, trimite notificările celor care n-au notat nimic azi (vezi .github/scripts/remind.mjs).
name: Amintiri
on:
  schedule:
    - cron: '7 * * * *'
  workflow_dispatch: {}
permissions:
  contents: read
concurrency:
  group: amintiri
  cancel-in-progress: false
jobs:
  remind:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
        with:
          sparse-checkout: .github/scripts
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Pachetele
        working-directory: .github/scripts
        run: npm init -y >/dev/null && npm i --no-audit --no-fund firebase-admin@13.6.0 web-push@3.6.7
      - name: Trimite
        working-directory: .github/scripts
        env:
          FIREBASE_SA: ${{ secrets.FIREBASE_SA }}
          VAPID_PRIVATE: ${{ secrets.VAPID_PRIVATE }}
          VAPID_PUBLIC: BM1CVJmgpne3MKGs95Qwcd4j2mgPEdAogfcFnvAPCjmXsaPjWbMYI646C7cuXtlSoMdN5B0oGwMjnPB1bD_aWG0
        run: node remind.mjs

<title>Careu – analiză meciuri</title>

<link rel="preconnect" href="https://a.espncdn.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sofia+Sans:wght@400;500;600;700;800&family=Sofia+Sans+Extra+Condensed:wght@600;700;800&display=swap">
<style>
:root{
  --page:#EEF1F4;--surface:#FFFFFF;--surface-2:#F3F5F8;--ink:#121A24;--ink-2:#475262;--muted:#76828F;
  --line:#DDE3E9;--draw:#C2CAD3;--s1:#2A78D6;--v:#0F7A2E;--e:#687384;--i:#C0352E;--live:#C8302A;--star:#D99A00;--focus:#2A78D6;
  --fa:"Sofia Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --fc:"Sofia Sans Extra Condensed","Sofia Sans Condensed","Arial Narrow",system-ui,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){
  --page:#0B111A;--surface:#141C27;--surface-2:#1C2633;--ink:#E9EEF4;--ink-2:#B3BDCA;--muted:#8592A1;
  --line:#243041;--draw:#4A576B;--s1:#3987E5;--v:#13803A;--e:#5F6B7C;--i:#C23A33;--live:#FF6A5E;--star:#F2B630;--focus:#6AA6F0;color-scheme:dark}}
:root[data-theme=dark]{
  --page:#0B111A;--surface:#141C27;--surface-2:#1C2633;--ink:#E9EEF4;--ink-2:#B3BDCA;--muted:#8592A1;
  --line:#243041;--draw:#4A576B;--s1:#3987E5;--v:#13803A;--e:#5F6B7C;--i:#C23A33;--live:#FF6A5E;--star:#F2B630;--focus:#6AA6F0;color-scheme:dark}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--page);color:var(--ink);font:400 16px/1.42 var(--fa);-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
a{color:inherit}
button{font:inherit;color:inherit;cursor:pointer}
img{display:block}
h1,h2,h3{font-weight:700}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px;border-radius:8px}
.app{max-width:640px;margin:0 auto;min-height:100vh;min-height:100dvh;padding-bottom:calc(84px + env(safe-area-inset-bottom))}

/* headers */
.hero{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;padding:calc(env(safe-area-inset-top) + 20px) 12px 12px 16px}
.hero h1{margin:0;font:800 42px/.9 var(--fc);letter-spacing:-.3px}
.ico{display:inline-grid;place-items:center;width:42px;height:42px;border:0;border-radius:12px;background:transparent;color:var(--ink-2);padding:0}
.ico svg{width:24px;height:24px}
.ico[aria-pressed=true]{color:var(--star)}
.bar{position:sticky;top:0;z-index:10;display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:4px;padding:calc(env(safe-area-inset-top) + 4px) 6px 4px;background:var(--page);background:color-mix(in srgb,var(--page) 84%,transparent);-webkit-backdrop-filter:saturate(1.5) blur(18px);backdrop-filter:saturate(1.5) blur(18px)}
.back{display:inline-flex;align-items:center;border:0;background:none;padding:9px 10px 9px 2px;font-weight:600;font-size:16px;color:var(--ink)}
.back svg{width:22px;height:22px}
.bar .ttl{text-align:center;font-weight:700;font-size:15.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar .rt{min-width:44px;display:flex;justify-content:flex-end}
.sec{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:28px 16px 10px}
.sec h2{margin:0;font:700 26px/1 var(--fc);letter-spacing:-.1px}
.sec .aside{font-size:13px;color:var(--muted);text-align:right}

/* lists */
.grp,.panel{background:var(--surface);margin:0 12px;border-radius:16px;overflow:hidden}
.row{position:relative;display:flex;align-items:center;gap:12px;min-height:50px;padding:10px 14px;text-decoration:none}
.row+.row::before,.mrow+.mrow::before,.lrow+.lrow::before,.frow+.frow::before,.tr+.tr::before,.hrow+.hrow::before{content:"";position:absolute;top:0;right:0;left:50px;border-top:1px solid var(--line)}
.grow{flex:1;min-width:0}
.row b{display:block;font-weight:600}
.row small{display:block;margin-top:1px;color:var(--muted);font-size:13.5px}
.chev{color:var(--muted);font-size:22px;line-height:1}
.note{margin:10px 16px;color:var(--muted);font-size:13.5px}
.panel .note{margin:12px 16px}
.empty{margin:30px 20px;color:var(--ink-2);font-size:15px}
.cr{width:24px;height:24px;object-fit:contain;flex:none}
.cr.lg{width:40px;height:40px}
.cr.xl{width:64px;height:64px}
.mono{display:inline-grid;place-items:center;border-radius:50%;background:var(--surface-2);color:var(--ink-2);font:800 9.5px/1 var(--fa)}
.cr.xl.mono{font-size:18px}.cr.lg.mono{font-size:13px}
.ci{width:20px;height:20px;object-fit:contain;flex:none}
.ci.f{display:inline-grid;place-items:center;font-size:16px;line-height:1}
.ci.lg{width:36px;height:36px;font-size:28px}
.ci.fl{display:block;width:auto;height:auto}.ci.fl svg{display:block;width:20px;height:14px;border-radius:3px;box-shadow:0 0 0 1px var(--line)}.ci.fl.lg svg{width:36px;height:24px;border-radius:4px}

/* day strip */
.days{display:flex;gap:6px;overflow-x:auto;padding:2px 12px 12px;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.days::-webkit-scrollbar{display:none}
.days a{flex:none;padding:8px 13px;border-radius:999px;background:var(--surface);color:var(--ink-2);font-weight:600;font-size:14.5px;text-decoration:none;white-space:nowrap}
.days a[aria-current=true]{background:var(--ink);color:var(--surface)}
.ch{display:flex;align-items:center;gap:9px;padding:20px 16px 8px;font-weight:700;font-size:15px;text-decoration:none}

/* match rows */
.mrow{position:relative;display:grid;grid-template-columns:54px 1fr auto;grid-template-rows:auto auto;align-items:center;column-gap:10px;row-gap:6px;padding:11px 14px 11px 6px;text-decoration:none}
.mrow+.mrow::before{left:60px}
.mrow .t{grid-row:1/3;text-align:center;font-weight:600;font-size:13.5px;color:var(--ink-2);font-variant-numeric:tabular-nums;line-height:1.15}
.mrow .t.live{color:var(--live)}
.mrow .tm{display:flex;align-items:center;gap:9px;min-width:0;font-size:15.5px}
.mrow .tm span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mrow .sc{font:700 19px/1 var(--fc);text-align:right;font-variant-numeric:tabular-nums;min-width:14px}
.mrow .cr{width:20px;height:20px}
.lo{color:var(--muted)}

/* match header */
.mh{position:relative;display:grid;grid-template-columns:1fr minmax(96px,auto) 1fr;gap:6px 8px;align-items:start;padding:20px 12px 16px;background:var(--surface);overflow:hidden}
.mh::before{content:"";position:absolute;inset:0;pointer-events:none;background:linear-gradient(100deg,color-mix(in srgb,var(--ca) 24%,transparent),transparent 42%,transparent 58%,color-mix(in srgb,var(--cb) 24%,transparent))}
.mh .side{position:relative;display:flex;flex-direction:column;align-items:center;gap:10px;text-align:center;text-decoration:none;min-width:0}
.mh .nm{font:700 21px/1.05 var(--fc);overflow-wrap:anywhere}
.mh .mid{position:relative;text-align:center;padding-top:8px}
.mh .big{font:800 48px/1 var(--fc);letter-spacing:-.5px;font-variant-numeric:tabular-nums;white-space:nowrap}
.mh .big .dash{padding:0 5px;color:var(--muted)}
.mh .vs{font:800 34px/1 var(--fc);color:var(--muted);padding-top:8px}
.mh .st{margin-top:6px;font-size:13px;color:var(--ink-2)}
.mh .st.live{color:var(--live);font-weight:700}
.mh .pen{margin-top:4px;font-size:13px;color:var(--ink-2)}
.mh .meta{position:relative;grid-column:1/-1;margin:8px 0 0;text-align:center;font-size:13.5px;color:var(--ink-2)}

/* probability rows: the broadcast element */
.lg{display:grid;grid-template-columns:1fr auto 1fr;gap:8px;padding:14px 16px 2px;font-size:13px;font-weight:600;color:var(--ink-2)}
.lg span{display:flex;align-items:center;gap:6px;min-width:0}
.lg span b{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lg span:last-child{justify-content:flex-end}

.pitch .pcc{left:50%;top:50%;width:92px;height:92px;margin:-46px 0 0 -46px;border-radius:50%}
.pitch .pcs{left:50%;top:50%;width:6px;height:6px;margin:-3px 0 0 -3px;border:0;border-radius:50%;background:rgba(255,255,255,.4)}
.pitch .pa{left:22%;right:22%;height:88px}.pitch .pa.t{top:7px;border-top:0}.pitch .pa.b{bottom:7px;border-bottom:0}
.pitch .ga{left:37%;right:37%;height:30px}.pitch .ga.t{top:7px;border-top:0}.pitch .ga.b{bottom:7px;border-bottom:0}
.pitch .parc{left:50%;width:70px;height:16px;margin-left:-35px}
.pitch .parc.t{top:95px;border-top:0;border-radius:0 0 35px 35px/0 0 16px 16px}
.pitch .parc.b{bottom:95px;border-bottom:0;border-radius:35px 35px 0 0/16px 16px 0 0}
.pt{position:absolute;z-index:1;display:flex;flex-direction:column;align-items:center;gap:4px;max-width:96px;padding:0;border:0;background:none;color:#fff;font:inherit;transform:translateX(-50%);cursor:pointer;-webkit-tap-highlight-color:transparent}
.pt .ph{position:relative;width:44px;height:44px;border-radius:50%;background:#E3E8ED;box-shadow:0 0 0 2px var(--ring,#fff)}
.pt .ph img,.pt .ph .mono{display:grid;width:44px;height:44px;border-radius:50%;object-fit:cover;object-position:50% 20%}
.pt .ph .mono{place-items:center;background:#E3E8ED;color:#3B4654;font:800 13px/1 var(--fa)}
.pt .bd{position:absolute;left:24px;bottom:-5px}
.pt .nm{max-width:100%;padding:1px 5px 2px;border-radius:6px;background:rgba(5,14,9,.62);font:600 12px/1.3 var(--fa);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pt .nm i{margin-right:3px;font-style:normal;font-weight:500;opacity:.75;font-variant-numeric:tabular-nums}
.pt.on .ph{box-shadow:0 0 0 2px #fff,0 0 0 5px var(--ring,#fff)}
.pt.on .nm{background:#fff;color:#0E1620}
.pt:focus-visible{outline:2px solid #fff;outline-offset:3px;border-radius:8px}
.bd{display:inline-block;padding:1px 5px;border-radius:6px;background:rgba(5,14,9,.8);box-shadow:0 0 0 1px rgba(255,255,255,.28);color:#fff;font:700 11.5px/1.3 var(--fa);white-space:nowrap;font-variant-numeric:tabular-nums}
.bd.r1{background:#C8372D}.bd.r2{background:#EE8A19;color:#111}.bd.r3{background:#A9C23C;color:#111}.bd.r4{background:#15873E}.bd.r5{background:#1C6FD1}
.ptm{position:absolute;left:12px;z-index:1;display:flex;align-items:center;gap:7px;padding:4px 6px 4px 5px;border-radius:12px;background:rgba(5,14,9,.5);font:700 13px var(--fa)}
.ptm.t{top:12px}.ptm.b{bottom:12px}
.ptm .cr{width:20px;height:20px}
.ptf{position:absolute;right:14px;z-index:1;color:rgba(255,255,255,.9);font:700 17px/1 var(--fc);letter-spacing:.4px;font-variant-numeric:tabular-nums}
.ptf.t{top:17px}.ptf.b{bottom:17px}
.ptm .bd{font-size:12.5px}
.pinfo{margin:10px 16px 12px;color:var(--ink-2);font-size:14px;line-height:1.45}
.pinfo b{color:var(--ink)}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]) .pitch{background-color:#1B4A31}}
:root[data-theme=dark] .pitch{background-color:#1B4A31}
/* meciurile arbitrului din sezon */
.rml{padding:0 0 6px}
.rm{display:flex;align-items:center;gap:10px;padding:8px 16px;font-size:14px}
.rm+.rm{border-top:1px solid var(--line)}
.rm .d{flex:none;width:50px;font-size:12.5px;color:var(--muted);font-variant-numeric:tabular-nums}
.rm .t{flex:1;min-width:0;line-height:1.25}
.rm .t b{display:block;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rm .t small{display:block;margin:1px 0 0;font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rm .c{flex:none;display:flex;align-items:center;gap:4px;font:700 14px/1 var(--fc);font-variant-numeric:tabular-nums}
.rm .c i{display:inline-block;width:9px;height:12px;border-radius:2px;background:#E8B400}
.rm .c i.r{margin-left:5px;background:#D93A2F}
.rm .c.q{color:var(--muted);font-weight:500}
/* fila Clasament */
.tbs{margin:0 12px 10px}
.ctab{margin:0 12px;border-radius:16px;background:var(--surface);overflow-x:auto;-webkit-overflow-scrolling:touch;overscroll-behavior-x:contain}
.ctab:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.ctab+.gname,.ctab+.tbo{margin-top:18px}
.stt{width:100%;border-collapse:separate;border-spacing:0;font-size:14.5px;font-variant-numeric:tabular-nums}
.stt th,.stt td{height:46px;padding:0 5px;border-bottom:1px solid var(--line);white-space:nowrap;text-align:center;font-weight:400}
.stt tbody tr:last-child>*{border-bottom:0}
.stt thead th{height:34px;font-size:12.5px;font-weight:600;color:var(--muted)}
.stt .c0{position:sticky;left:0;z-index:1;padding:0 8px 0 0;background:var(--surface);text-align:left;box-shadow:inset -1px 0 0 var(--line)}
.stt thead .c0{padding-left:10px}
.stt tbody .c0::before{content:"";position:absolute;left:0;top:7px;bottom:7px;width:4px;border-radius:0 3px 3px 0;background:var(--nc,transparent)}
.stt .c0 a{display:flex;align-items:center;gap:8px;height:46px;padding-left:9px;color:inherit;text-decoration:none}
.stt .ps{flex:none;display:inline-block;width:20px;margin-right:2px;text-align:right;color:var(--ink-2)}
.stt thead .ps{margin-right:10px}
.stt .cr{width:22px;height:22px}
.stt .tn{display:block;max-width:116px;overflow:hidden;text-overflow:ellipsis;font-weight:500}
.stt td{min-width:25px;color:var(--ink-2)}
.stt td.gg{min-width:42px}
.stt td.tpt b{color:var(--ink);font-weight:700}
.stt .fm{padding:0 12px 0 8px;text-align:left}
.stt thead .fm{text-align:left;padding-left:10px}
.stt tr.me>*{background:color-mix(in srgb,var(--mc) 13%,var(--surface))}
.stt tr.me .tn{font-weight:700}
@media (min-width:560px){.stt .tn{max-width:220px}}
.fis{display:inline-flex;align-items:center;gap:5px;vertical-align:middle}
.fis.none{color:var(--muted)}
.fi{display:inline-grid;place-items:center;flex:none;width:20px;height:20px;padding:0;border:0;border-radius:50%;color:#fff;cursor:pointer}
.fi svg{width:12px;height:12px;fill:none;stroke:currentColor;stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round}
.fi.W{background:var(--v)}.fi.D{background:var(--e)}.fi.L{background:var(--i)}
.fi.last{margin-left:3px;outline:2px solid;outline-offset:2px}
.fi.W.last{outline-color:var(--v)}.fi.D.last{outline-color:var(--e)}.fi.L.last{outline-color:var(--i)}
.fi:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
details.tbo{margin:18px 0 0}
details.tbo>summary{margin:0 16px 4px;padding:8px 0;font-weight:600;color:var(--ink-2)}
#tb-fi:empty{display:none}
.tleg{margin:12px 12px 0;padding:6px 16px 10px;border-radius:16px;background:var(--surface)}
.tleg h3{margin:10px 0 6px;font-size:14.5px}
.tleg p{display:flex;align-items:center;gap:10px;margin:7px 0;font-size:14px;color:var(--ink-2)}
.tleg p.sm{display:block;font-size:13px;color:var(--muted)}
.tleg .zq{width:12px;height:12px;border-radius:3px;flex:none}
.tleg .fi{cursor:default}
.sb .v small{display:block;margin-top:4px;font:500 11.5px/1 var(--fa);color:var(--muted)}
.lb .lbh{margin:0;padding:12px 16px 4px;font-size:13px;font-weight:600;color:var(--muted)}
.lb .lr{display:grid;grid-template-columns:22px 24px minmax(0,1fr) auto;align-items:center;gap:9px;padding:10px 16px;color:inherit;text-decoration:none}
.lb .lr+.lr,.lb .gap+.lr{border-top:1px solid var(--line)}
.lb .lr .k{text-align:right;color:var(--muted);font-variant-numeric:tabular-nums}
.lb .lr .cr{width:24px;height:24px}
.lb .lr .n b{display:block;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lb .lr .n small{display:block;margin:2px 0 0;font-size:12.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lb .lr .v{font:700 19px/1 var(--fc);font-variant-numeric:tabular-nums}
.lb .lr.me{background:color-mix(in srgb,var(--mc) 13%,var(--surface))}
.lb .gap{margin:0;padding:0 16px 2px;border-top:1px solid var(--line);color:var(--muted);text-align:center;letter-spacing:2px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

            if (!prev || pr > prev.pr) map.set(t.id, { id: t.id, name: t.name, en: t.en, short: t.short, abbr: t.abbr, logo: t.logo, lg: nat ? '' : slug, nat, sub: nat ? 'Echipă națională' : compLabel(slug), pr });
          }

      })));
      items = [...map.values()].map(({ pr, ...t }) => t);

      if (items.length > 100) store.cache('idx', { v: IDX_V, t: Date.now(), items: items.map(t => [t.id, t.name, t.en !== t.name ? t.en : 0, t.short !== t.name ? t.short : 0, t.abbr, t.logo !== std(t.id) ? t.logo : 0, t.lg, t.nat ? 1 : 0]) });
    }

    for (const t of TEAMS.values()) if (!seen.has(t.id) && t.name) items.push({ id: t.id, name: t.name, en: t.en, short: t.short, abbr: t.abbr, logo: t.logo, lg: t.lg || '', nat: !!t.nat, sub: t.nat ? 'Echipă națională' : compLabel(t.lg) });

    if (ids.some(id => !apFresh(id))) {

    }

  // toate meciurile arbitrului din sezon: lista fiecărei competiții, apoi arbitrul fiecărui meci necitit încă
  const season = async () => {
    const R = S.ref;
    if (R.busy || !R.name || !ev.slug) return;
    R.busy = true; R.msg = `Caut meciurile sezonului ${seasonName(R.from, R.country)} în competițiile în care arbitrează…`; draw('rf');
    let sc = null;
    try {
      sc = await refSeasonScan(R, ev.id, (st, step) => {

        const el = $('#refp');
        if (el && st.total) el.textContent = `Citesc arbitrii meciurilor din sezon (${st.done} din ${st.total})…`;
      });
    } catch (e) { plErr('arbitru', e); }
    R.busy = false; R.scan = sc;
    // competițiile UEFA, când sunt multe, le spun pe scurt
    const EU = [...UEFA_MAIN, ...UEFA_QUAL], lab = L => { L = uniq(L); const eu = L.filter(q => EU.includes(q)), rest = L.filter(q => !EU.includes(q)).map(refLbl); return listRo(eu.length >= 4 ? [...rest, 'competițiile UEFA (cupe europene și echipe naționale)'] : [...rest, ...eu.map(refLbl)]); };
    R.msg = !sc ? 'Nu am putut citi meciurile sezonului.' : [sc.listed.length ? `Am căutat în ${lab(sc.listed)}.` : '', sc.failed.length ? `Nu am putut citi ${lab(sc.failed)}.` : '',
      sc.skipped.length ? `Cupele europene și meciurile echipelor naționale nu au fost citite: ESPN nu a răspuns la cererile scurte, iar foile întregi ar fi prea multe.` : ''].filter(Boolean).join(' ');
    try { odds(); } catch (e) { plErr('arbitru', e); }
    draw('rf', 'pk', 'dg');
  };
  if (src !== undefined) after();
  else srcJob.then(s => { if (!live()) return; try { build(s); } catch (e) { plErr('surse', e); return; } draw(); after(); });
}


/* ---------- fila Clasament: clasamentul competiției, acasă și în deplasare, forma și statistici pe echipe ---------- */
// Clasamentul total (locuri, puncte, zonele de calificare și retrogradare) e cel oficial: ESPN, iar pentru Liga 1, Liga 2 și
// Cupa României 365Scores. Forma (ultimele 5 meciuri), clasamentele acasă și în deplasare și statisticile pe echipe le calculez
// din meciurile jucate în sezon în aceeași competiție: rezultatele și, unde sursa le are, cornerele, cartonașele, șuturile pe
// poartă, posesia și faulturile (din listele de meciuri ESPN; la competițiile românești, din statisticile 365Scores ale fiecărui meci).

// un meci, compact: [id, ms, idGazde, idOaspeți, golGazde, golOaspeți, statGazde, statOaspeți]
// stat = [cornere, galbene, roșii, șuturi pe poartă, posesie, șuturi, faulturi]
// lunile încheiate se păstrează pe telefon, ca la o vizită nouă să cer doar luna curentă
const TBL = store.get('lgc', {});
let tbDirty = false;
function tbFlush() {
  if (!tbDirty) return;
  tbDirty = false;
  const at = o => Math.max(0, ...Object.values(o || {}).map(m => (Array.isArray(m) ? m[0] || 0 : 0)));
  const ks = Object.keys(TBL);
  if (ks.length > 14) ks.sort((a, b) => at(TBL[a]) - at(TBL[b])).slice(0, ks.length - 10).forEach(k => delete TBL[k]);
  store.cache('lgc', TBL);
}
setInterval(tbFlush, 6000);
addEventListener('pagehide', tbFlush);
const tbErr = (where, e) => { LOG.unshift(`${new Date().toLocaleTimeString('ro-RO')}  fila Clasament, ${where}: ${e?.message || e}`); LOG.length = Math.min(LOG.length, 40); };

// de când citesc meciurile: începutul sezonului (1 iulie; în ligile pe an calendaristic 1 ianuarie);
// la echipele naționale, ultimele 11 luni (o campanie de calificare sau un turneu final)
const TB_CAL = new Set(['usa.1', 'bra.1', 'arg.1']);
function tbFrom(slug, now = new Date()) {
  if (NAT.has(slug)) return new Date(now.getTime() - 330 * 864e5);
  if (TB_CAL.has(slug)) return new Date(now.getFullYear(), 0, 1);
  return new Date(now.getMonth() >= 6 ? now.getFullYear() : now.getFullYear() - 1, 6, 1);
}
// campionat (are clasament pe tot sezonul), nu cupă, supercupă, amical sau preliminarii
const tbIsLeague = s => !!s && !NAT.has(s) && !/cup|pokal|copa|coppa|coupe|taca|beker|\.fa$|super|charity|shield|friendly|qual/.test(s) && COMP[s]?.g !== 'eu';
const tbSt = o => (o && typeof o === 'object' ? [o.c, o.y, o.r, o.st, o.p, o.sh, o.f].map(v => (fin(v) ? v : null)) : null);
function tbRow(e) {
  const s = STATS[e.id]?.[1], t = s?.ok ? s.t : null;
  return [String(e.id), Date.parse(e.date) || 0, String(e.home.id), String(e.away.id), e.home.score, e.away.score, tbSt(t?.[e.home.id]), tbSt(t?.[e.away.id])];
}
// meciurile terminate ale competiției, lună de lună (aceleași liste ca la arbitru)
async function tbSeason(slug, from, to, onProg) {
  const months = [];
  for (let a = new Date(from.getFullYear(), from.getMonth(), 1); a <= to; a = new Date(a.getFullYear(), a.getMonth() + 1, 1)) months.push(a);
  const got = new Map();
  let done = 0, bad = 0;
  await Promise.all(months.map(a => lim(async () => {
    const mk = `${a.getFullYear()}-${a.getMonth() + 1}`, end = new Date(a.getFullYear(), a.getMonth() + 1, 0, 23, 59, 59);
    const closed = end.getTime() < Date.now() - 3 * 864e5, hit = TBL[slug]?.[mk];
    try {
      let rows;
      if (closed && Array.isArray(hit?.[1])) rows = hit[1];
      else {
        const L = await once(`lg:${slug}:${mk}`, 20 * 60e3, () => monthGames(slug, a < from ? from : a, end < to ? end : to));
        rows = arr(L).map(g => g?.e).filter(e => e && e.done && e.home && e.away && fin(e.home.score) && fin(e.away.score)).map(tbRow);
        if (closed) { (TBL[slug] ||= {})[mk] = [Date.now(), rows]; tbDirty = true; }
      }
      for (const r of rows) if (Array.isArray(r) && r.length >= 6) got.set(r[0], r);
    } catch (e) { bad++; }
    onProg?.(++done, months.length);
  })));
  return { rows: [...got.values()].sort((x, y) => x[1] - y[1]), bad, months: months.length };
}
// la competițiile 365Scores, statisticile se citesc meci cu meci (o singură dată: rămân în memoria aplicației)
async function tbStats365(rows, onProg) {
  const need = rows.filter(r => is365(r[0]) && (!r[6] || !r[7])).slice(-220);
  let done = 0;
  await Promise.all(need.map(r => lim365(async () => {
    try {
      const s = await matchStats({ id: r[0], done: true });
      if (s?.ok) { const h = tbSt(s.t?.[r[2]]), a = tbSt(s.t?.[r[3]]); if (h && a) { r[6] = h; r[7] = a; tbDirty = true; } }
    } catch (e) {}
    onProg?.(++done, need.length);
  })));
  return need.length;
}

/* calculele: meciurile unei echipe, clasamentul unei grupe, statisticile pe echipe */
function tbGames(rows, id) {
  const G = [];
  for (const r of arr(rows)) {
    // un rând stricat (de exemplu din memoria telefonului) se sare
    if (!Array.isArray(r) || !fin(r[4]) || !fin(r[5])) continue;
    const h = r[2] === id, a = r[3] === id;
    if (!h && !a) continue;
    const gf = h ? r[4] : r[5], ga = h ? r[5] : r[4];
    G.push({ m: r[0], t: fin(r[1]) ? r[1] : 0, home: h, gf, ga, hs: r[4], as: r[5], opp: h ? r[3] : r[2], r: gf > ga ? 'W' : gf < ga ? 'L' : 'D', s: h ? r[6] : r[7], so: h ? r[7] : r[6] });
  }
  return G;
}
function tbRec(G) {
  const o = { gp: G.length, w: 0, d: 0, l: 0, gf: 0, ga: 0 };
  for (const g of G) { o[g.r === 'W' ? 'w' : g.r === 'D' ? 'd' : 'l']++; o.gf += g.gf; o.ga += g.ga; }
  o.gd = o.gf - o.ga; o.pts = 3 * o.w + o.d; o.form = G.slice(-5);
  return o;
}
// side: all (clasamentul oficial, cu forma calculată), home sau away (calculate din meciuri)
function tbGroup(g, rows, side) {
  const per = g.rows.map(r => { const G = tbGames(rows, r.team.id); return { r, G, rec: tbRec(side === 'home' ? G.filter(x => x.home) : side === 'away' ? G.filter(x => !x.home) : G) }; });
  const v = (a, b) => (fin(a) ? a : b);
  if (side === 'all') return per.map(({ r, rec }) => ({ team: r.team, rank: r.rank, gp: v(r.gp, rec.gp), w: v(r.w, rec.w), d: v(r.d, rec.d), l: v(r.l, rec.l), gf: v(r.gf, rec.gf), ga: v(r.ga, rec.ga),
    gd: v(r.gd, fin(r.gf) && fin(r.ga) ? r.gf - r.ga : rec.gd), pts: v(r.pts, rec.pts), note: r.note, nc: r.nc, form: rec.gp ? rec.form : arr(r.rf) }));
  return per.map(({ r, rec }) => ({ team: r.team, gp: rec.gp, w: rec.w, d: rec.d, l: rec.l, gf: rec.gf, ga: rec.ga, gd: rec.gd, pts: rec.pts, form: rec.form }))
    .sort((a, b) => b.pts - a.pts || b.gd - a.gd || b.gf - a.gf || String(a.team.name).localeCompare(String(b.team.name), 'ro')).map((x, i) => ({ ...x, rank: i + 1 }));
}
// statisticile unei echipe în competiție
function tbTeamStats(rows, id) {
  const G = tbGames(rows, id), s = { gp: G.length, gf: 0, ga: 0, cs: 0, btts: 0, o25: 0, sum: Array(7).fill(0), n: Array(7).fill(0), sumO: Array(7).fill(0), nO: Array(7).fill(0) };
  for (const g of G) {
    s.gf += g.gf; s.ga += g.ga;
    if (!g.ga) s.cs++;
    if (g.gf && g.ga) s.btts++;
    if (g.gf + g.ga >= 3) s.o25++;
    if (Array.isArray(g.s)) g.s.forEach((x, i) => { if (fin(x)) { s.sum[i] += x; s.n[i]++; } });
    if (Array.isArray(g.so)) g.so.forEach((x, i) => { if (fin(x)) { s.sumO[i] += x; s.nO[i]++; } });
  }
  return s;
}
const tbAvg = (s, i) => (s.n[i] ? s.sum[i] / s.n[i] : null);
const tbAvgO = (s, i) => (s.nO[i] ? s.sumO[i] / s.nO[i] : null);
const tbPct = v => (fin(v) ? Math.round(v * 100) + '%' : '–');
// clasamentele pe statistici; n: câte meciuri au datele (cele cu prea puține meciuri nu intră în clasament)
const TB_BOARDS = [
  { k: 'att', l: 'Atac', h: 'Goluri marcate pe meci', v: s => (s.gp ? s.gf / s.gp : null), n: s => s.gp, f: v => nf2.format(v), sub: s => `${plural(s.gf, 'gol', 'goluri')} în ${plural(s.gp, 'meci', 'meciuri')}` },
  { k: 'def', l: 'Apărare', h: 'Goluri primite pe meci (cele mai puține)', asc: true, v: s => (s.gp ? s.ga / s.gp : null), n: s => s.gp, f: v => nf2.format(v), sub: s => `${plural(s.ga, 'gol primit', 'goluri primite')}; fără gol primit în ${plural(s.cs, 'meci', 'meciuri')}` },
  { k: 'cor', l: 'Cornere', h: 'Cornere obținute pe meci', st: 1, v: s => tbAvg(s, 0), n: s => s.n[0], f: f1, sub: s => `adversarii: ${f1(tbAvgO(s, 0))} pe meci; din ${plural(s.n[0], 'meci', 'meciuri')}` },

  { k: 'o25', l: 'Peste 2,5 goluri', h: 'Meciuri cu cel puțin 3 goluri', v: s => (s.gp ? s.o25 / s.gp : null), n: s => s.gp, f: tbPct, sub: s => `${s.o25} din ${plural(s.gp, 'meci', 'meciuri')}` },
  { k: 'btts', l: 'Ambele marchează', h: 'Meciuri în care au marcat ambele echipe', v: s => (s.gp ? s.btts / s.gp : null), n: s => s.gp, f: tbPct, sub: s => `${s.btts} din ${plural(s.gp, 'meci', 'meciuri')}` },
  { k: 'cs', l: 'Fără gol primit', h: 'Meciuri fără gol primit', v: s => (s.gp ? s.cs / s.gp : null), n: s => s.gp, f: tbPct, sub: s => `${s.cs} din ${plural(s.gp, 'meci', 'meciuri')}` },
  { k: 'foul', l: 'Faulturi', h: 'Faulturi comise pe meci', st: 1, v: s => tbAvg(s, 6), n: s => s.n[6], f: f1, sub: s => `faulturile adversarilor: ${f1(tbAvgO(s, 6))} pe meci` }
];
// clasamentul echipelor la o statistică: doar cele cu destule meciuri (cel puțin 40% din cele ale echipei cu cele mai multe)
function tbRank(B, teams) {
  const L = teams.map(t => ({ t: t.team, s: t.s, v: B.v(t.s), n: B.n(t.s) })).filter(x => fin(x.v) && x.n > 0);
  const need = Math.max(1, Math.round(Math.max(0, ...L.map(x => x.n)) * 0.4));
  return L.filter(x => x.n >= need).sort((a, b) => (B.asc ? a.v - b.v : b.v - a.v) || String(a.t.name).localeCompare(String(b.t.name), 'ro')).map((x, i) => ({ ...x, rank: i + 1 }));
}

async function renderPicks(live) {
  const P = store.get('picks', {});
  const ids = Object.keys(P).sort((a, b) => new Date(P[b].date) - new Date(P[a].date));
  const box = $('#pk');
  if (!ids.length) { box.innerHTML = `<p class="empty">Când alegi un rezultat pe pagina unui meci viitor, apare aici și îl verific după fluier.</p>`; return; }
  const out = new Map();
  const draw = () => {
    if (!live()) return;
    let hit = 0, tot = 0, exact = 0;
    const rows = ids.map(id => {
      const p = P[id], r = out.get(id);
      let res = `<span class="res">${new Date(p.date) > Date.now() ? esc(whenShort(p.date)) : 'aștept rezultatul'}</span>`;
      if (r) {
        const o = r.h > r.a ? '1' : r.h < r.a ? '2' : 'X';
        const okP = p.pick ? p.pick === o : null, okS = p.score ? p.score === `${r.h}-${r.a}` : null;
        if (okP != null) { tot++; if (okP) hit++; }
        if (okS) exact++;
        const good = okP ?? okS;
        res = `<span class="res ${good ? 'ok' : 'no'}">${r.h}–${r.a}: ${okS ? 'scor exact' : good ? 'nimerit' : 'ratat'}</span>`;
      }
      return `<a class="row" href="#/m/${esc(p.slug || 'x')}/${esc(id)}"><span class="grow"><b>${esc(p.h)} – ${esc(p.a)}</b><small>Ai ales ${p.pick ? (p.pick === 'X' ? 'egal' : p.pick === '1' ? esc(p.h) : esc(p.a)) : 'doar scorul'}${p.score ? `, scor ${esc(p.score)}` : ''}</small></span>${res}</a>`;
    }).join('');
    box.innerHTML = `${tot ? `<p class="note">Ai nimerit ${hit} din ${tot} rezultate${exact ? `, plus ${exact} ${exact === 1 ? 'scor exact' : 'scoruri exacte'}` : ''}.</p>` : ''}<div class="grp plain">${rows}</div>`;
  };
  draw();
  await Promise.all(ids.filter(id => new Date(P[id].date).getTime() < Date.now() - 105 * 60e3).map(id => lim(async () => {
    try { const { ev: e } = await finalResult(id, P[id].slug); if (e?.done) out.set(id, { h: e.home.score, a: e.away.score }); } catch (e) {}
  })));
  draw();
}

function perfHTML(m, n) {
  if (!m) return `<div class="sec"><h2>Cât de bine prezice</h2></div><p class="note">Scorurile apar după 30 de meciuri învățate cu modelul nou${n ? ` (acum ${n})` : ''}. Le obții repede cu antrenamentul de mai jos.</p>`;
  const row = (label, d, c, fmt, hi) => {
    const ok = fin(d) && fin(c) && Math.abs(d - c) > 1e-9;
    const bd = ok && (hi ? d > c : d < c), bc = ok && !bd;
    return `<div class="mrw"><span>${label}</span><span class="v${bd ? ' b' : ''}">${fin(d) ? fmt(d) : '–'}</span><span class="v${bc ? ' b' : ''}">${fin(c) ? fmt(c) : '–'}</span></div>`;
  };
  const { def: D, cal: C } = m;
  const rows = [
    row('Rezultat ghicit', D.g.acc, C.g.acc, pct, true),
    row('Log loss', D.g.ll, C.g.ll, v => nf3.format(v)),
    row('Scor Brier', D.g.br, C.g.br, v => nf3.format(v)),
    row('Eroare medie la goluri', D.g.mae, C.g.mae, v => nf2.format(v))
  ];
  if (D.c && C.c) rows.push(row('Cornere: cine are mai multe', D.c.acc, C.c.acc, pct, true), row('Eroare medie la cornere', D.c.mae, C.c.mae, v => nf2.format(v)));
  if (D.k && C.k) rows.push(row('Cartonașe: cine are mai multe', D.k.acc, C.k.acc, pct, true), row('Eroare medie la cartonașe', D.k.mae, C.k.mae, v => nf2.format(v)));
  if (D.s && C.s) rows.push(row('Șuturi: cine are mai multe', D.s.acc, C.s.acc, pct, true), row('Eroare medie la șuturi', D.s.mae, C.s.mae, v => nf2.format(v)));
  if (D.t && C.t) rows.push(row('Pe poartă: cine are mai multe', D.t.acc, C.t.acc, pct, true), row('Eroare medie la șuturi pe poartă', D.t.mae, C.t.mae, v => nf2.format(v)));
  const O = m.old;
  return `<div class="sec"><h2>Cât de bine prezice</h2><span class="aside">${plural(C.g.n, 'meci testat', 'meciuri testate')}</span></div>
    <div class="grp mt"><div class="mrw hd"><span></span><span class="v">Inițial</span><span class="v">Calibrat</span></div>${rows.join('')}</div>
    <p class="note">Aici e doar modelul, fără cote. Validare cronologică: meciurile se iau în ordinea datei, iar fiecare e prezis de un model care a învățat doar din meciurile jucate înaintea lui, ca scorul să fie cinstit. „Inițial” înseamnă valorile de pornire, potrivite pe peste 6.000 de meciuri din campionatele mari; la goluri, calibrarea se mută încet de la ele, așa că cele două coloane ies apropiate. La log loss, Brier și erori, mai mic e mai bine. Varianta mai bună e scrisă îngroșat.</p>
    ${O ? `<p class="note">Modelul de dinainte (media atacului și a apărării din forma scurtă), pe aceleași meciuri: log loss ${nf3.format(O.ll)}${fin(C.g.ll) ? ` față de ${nf3.format(C.g.ll)} acum` : ''}, rezultat ghicit ${pct(O.acc)}${fin(C.g.acc) ? ` față de ${pct(C.g.acc)}` : ''}.</p>` : ''}
    ${m.rel?.filter(b => b.n >= REL_MIN).length >= 2 ? relHTML(m.rel) : ''}`;
}
const REL_MIN = 10;

function betListHTML() {
  if (!BETS.length) return `<p class="note">Încă n-ai notat niciun pariu.</p>`;
  return `<div class="grp plain">${[...BETS].sort((a, b) => b.t - a.t).map(b => {
    const st = b.res === 'w' ? `<span class="res ok">${sgnMoney(b.stake * (b.odds - 1))}</span>` : b.res === 'l' ? `<span class="res no">${sgnMoney(-b.stake)}</span>` : b.res === 'v' ? '<span class="res">anulat</span>' : '<span class="res">în așteptare</span>';
    const clv = fin(b.close) && b.close > 1 ? ` · CLV ${sgn1(b.odds / b.close - 1)}${b.ca ? ' (închidere automată)' : ''}` : '';
    return `<button type="button" class="row" data-bet="${esc(b.id)}"><span class="grow"><b>${esc(b.ev)}</b><small>${esc(b.sel)} la ${nf2.format(b.odds)} · ${money(b.stake)}${clv}</small></span>${st}</button>`;
  }).join('')}</div>`;
}
function betFormHTML() {
  const saved = Object.entries(LEARN.s).filter(([, s]) => s.src === 'live' && s.P).sort((a, b) => new Date(b[1].d) - new Date(a[1].d)).slice(0, 40);
  return `<div class="panel">
    ${saved.length ? `<label class="field"><span>Din pronosticurile aplicației<small>opțional: ia meciul și probabilitățile lui</small></span><select id="bm"><option value="">— alt meci —</option>${saved.map(([id, s]) => `<option value="${esc(id)}">${esc(s.hn)} – ${esc(s.an)}</option>`).join('')}</select></label>
    <div class="field col" id="bpk" hidden style="padding-top:0"></div>` : ''}
    <label class="field col"><span>Meciul</span><input type="text" id="bev" placeholder="ex. Rapid – FCSB" autocomplete="off" maxlength="80"></label>
    <label class="field col" style="padding-top:0"><span>Selecția</span><input type="text" id="bsel" placeholder="ex. 1, X, 2, Peste 2,5" autocomplete="off" maxlength="40"></label>
    <div class="bgrid"><label class="field col" style="padding-top:0"><span>Cota</span><input type="text" inputmode="decimal" id="bod" placeholder="2,10" autocomplete="off" maxlength="8"></label>
    <label class="field col" style="padding-top:0"><span>Miza (lei)</span><input type="text" inputmode="decimal" id="bst" placeholder="20" autocomplete="off" maxlength="8"></label></div>
    <p class="note" id="bval" role="status" style="margin:0 16px 8px"></p>
    <div class="acts" style="padding:2px 16px 14px"><button class="btn pri" type="button" id="badd">Salvează pariul</button><span class="note" id="bmsg" role="status" style="margin:0 0 0 4px;align-self:center"></span></div>
  </div>`;
}
function openBet(id, after) {
  const b = BETS.find(x => x.id === id);
  if (!b) return;
  let res = b.res || '';
  openSheet(`<div class="sh-top"><h2 id="sht">${esc(b.ev)}</h2><button class="ico" type="button" data-act="close" aria-label="Închide">${ICON.x}</button></div>
    <p class="note" style="margin:0 16px 8px">${esc(b.sel)} la ${nf2.format(b.odds)}, miza ${money(b.stake)}${b.pm != null ? `; aplicația dădea ${pct(b.pm)}` : ''}.</p>
    <label class="field col"><span>Cota de închidere<small>cota la care se închide piața, chiar înainte de meci; ideal de la aceeași casă sau de la Pinnacle</small></span><input type="text" inputmode="decimal" id="bcl" value="${fin(b.close) ? String(b.close).replace('.', ',') : ''}" placeholder="ex. 1,95" autocomplete="off" maxlength="8"></label>
    <div class="field col" style="padding-top:0"><span>Rezultat${b.pk != null && b.res ? '<small>decis automat din rezultatul aplicației; îl poți schimba</small>' : ''}</span><div class="seg wide sm" role="group" aria-label="Rezultat">${[['', 'Așteaptă'], ['w', 'Câștigat'], ['l', 'Pierdut'], ['v', 'Anulat']].map(([k, l]) => `<button type="button" data-res="${k}" aria-pressed="${res === k}">${l}</button>`).join('')}</div></div>
    <div class="acts"><button class="btn pri" type="button" id="bsv">Salvează</button><button class="btn" type="button" id="bdl">Șterge pariul</button></div>`);
  $('#shin').setAttribute('aria-labelledby', 'sht');
  $$('#shin [data-res]').forEach(el => el.addEventListener('click', () => { res = el.dataset.res; $$('#shin [data-res]').forEach(x => x.setAttribute('aria-pressed', String(x.dataset.res === res))); }));
  $('#bsv').addEventListener('click', () => {
    const c = parseNum($('#bcl').value);
    const nc = c != null && c > 1 ? c : null;
    if (nc !== b.close) b.ca = 0;
    b.close = nc; b.res = res || null;
    saveBets(); closeSheet(); after();
  });
  let armed = false;
  $('#bdl').addEventListener('click', e => {
    const el = e.currentTarget;
    if (!armed) { armed = true; el.textContent = 'Apasă din nou ca să ștergi'; later(() => { armed = false; if (el.isConnected) el.textContent = 'Șterge pariul'; }, 4000); return; }
    BETS.splice(BETS.indexOf(b), 1); saveBets(); closeSheet(); after();
  });
}
function viewBets(live) {
  if (BT === 'load') {
    V.innerHTML = `${topBar('Pariuri')}<p class="note">Încarc meciurile învățate…</p>`;
    btReady.then(() => { if (live()) route({ keep: true }); });
    return;
  }
  autoSettle();
  const S = learned(), SG = S.filter(hasG), nK = SG.filter(hasK).length;
  if (S.length && (!LEARN.fit || LEARN.fit.n !== S.length)) refit();
  draft = newDraft();
  V.innerHTML = `${topBar('Pariuri')}
    <p class="lead">Aici vezi dacă modelul ar fi bătut cotele pe meciurile trecute, pe fiecare piață și competiție, și îți notezi pariurile tale. Cotele caselor sunt greu de bătut; semnul cel mai sigur de avantaj e să prinzi constant cote mai bune decât cele de la închidere (CLV), pe câteva sute de pariuri.</p>
    <div id="val"></div>
    ${moveHTML()}
    <div class="sec"><h2>Jurnalul tău</h2></div>
    <div id="bsum">${betSumHTML()}</div>
    <div class="sec"><h2>Adaugă un pariu</h2></div>
    ${betFormHTML()}
    <div class="sec"><h2>Pariurile tale</h2></div>
    <div id="blist">${betListHTML()}</div>
    <p class="method"><b>Despre jurnal.</b> Aplicația nu plasează pariuri, nu arată cotele caselor și nu trimite către ele: aici rămâne doar ce scrii tu, pe acest dispozitiv, și se păstrează și când golești cache-ul. Profitul și ROI-ul se calculează din pariurile decise (câștigat sau pierdut; cele anulate nu intră). CLV = cota ta împărțită la cota de închidere, minus 1. Un pariu notat dintr-un pronostic al aplicației, cu 1, X sau 2, se decide singur după rezultat și primește singur cota de închidere, dacă aplicația a citit-o (o poți corecta). Pariază doar sume pe care ți le permiți să le pierzi.</p>`;
  const drawLists = () => { $('#bsum').innerHTML = betSumHTML(); $('#blist').innerHTML = betListHTML(); };
  const drawVal = m => {
    const box = $('#val'); if (!box) return;
    box.innerHTML = valueHTML(m, nK);
    $$('[data-vm]', box).forEach(el => el.addEventListener('click', () => { valM = +el.dataset.vm; drawVal(m); }));
    $$('[data-vs]', box).forEach(el => el.addEventListener('click', () => { valS = el.dataset.vs; drawVal(m); }));
    $$('[data-vk]', box).forEach(el => el.addEventListener('click', () => { valK = el.dataset.vk; drawVal(m); }));
    $$('[data-kf]', box).forEach(el => el.addEventListener('click', () => { valKF = +el.dataset.kf; drawVal(m); }));
    $('#vth', box)?.addEventListener('change', e => { valT = +e.target.value; drawVal(m); });
  };
  if (SG.length >= 30) {
    $('#val').innerHTML = '<div class="sec"><h2>Ar fi câștigat modelul?</h2></div><p class="note">Calculez simularea…</p>';
    later(() => { if (live()) drawVal(ensureEval(SG)); }, 40);
  } else drawVal(null);
  const hint = () => {
    const el = $('#bval'); if (!el) return;
    const od = parseNum($('#bod').value), pm = draft.pm;
    if (pm == null || !(od > 1)) { el.textContent = ''; return; }
    const ev = pm * od - 1;
    el.textContent = ev > 0
      ? `După aplicație, valoarea e ${sgnPct(ev)}: ea dă ${pct(pm)}, iar cota implică ${pct(1 / od)}. Dacă probabilitatea ei e corectă, un sfert de Kelly ar fi ${nf1.format(Math.max(0, ev / (od - 1) / 4 * 100))}% din bancă. Nu uita că piața vede accidentările, iar modelul nu.`
      : `După aplicație, aici nu e valoare: ea dă ${pct(pm)}, iar cota implică ${pct(1 / od)}.`;
  };
  $('#bm')?.addEventListener('change', e => {
    const id = e.target.value, s = LEARN.s[id], box = $('#bpk');
    draft = newDraft();
    if (!s) { box.hidden = true; box.innerHTML = ''; hint(); return; }
    draft.id = id;
    $('#bev').value = `${s.hn} – ${s.an}`;
    const lab = [`1 · ${s.hn}`, 'X · egal', `2 · ${s.an}`];
    box.hidden = false;
    box.innerHTML = `<span>Pe ce pariezi</span><div class="seg wide sm" role="group" aria-label="Pe ce pariezi">${lab.map((l, i) => `<button type="button" data-pk="${i}" aria-pressed="false">${esc(l)} ${pct(s.P[i])}</button>`).join('')}</div>`;
    $$('[data-pk]', box).forEach(el => el.addEventListener('click', () => {
      draft.pk = +el.dataset.pk; draft.pm = s.P[draft.pk];
      $$('[data-pk]', box).forEach(x => x.setAttribute('aria-pressed', String(+x.dataset.pk === draft.pk)));
      $('#bsel').value = ['1', 'X', '2'][draft.pk];
      hint();
    }));
    hint();
  });
  $('#bod').addEventListener('input', hint);
  $('#badd').addEventListener('click', () => {
    const msg = $('#bmsg'), ev = $('#bev').value.trim(), sel = $('#bsel').value.trim(), odds = parseNum($('#bod').value), stake = parseNum($('#bst').value);
    const err = !ev ? 'Scrie meciul.' : !sel ? 'Scrie selecția.' : !(odds > 1) ? 'Cota trebuie să fie peste 1.' : !(stake > 0) ? 'Scrie miza.' : '';
    if (err) { msg.textContent = err; return; }
    const s = draft.id ? LEARN.s[draft.id] : null, id = 'b' + Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
    BETS.push({ id, t: Date.now(), d: s?.d || new Date().toISOString(), ev, sel, odds, stake, close: null, res: null, pm: draft.pm, pk: draft.pk, mid: draft.pk != null ? draft.id : null });
    autoSettle();
    if (!saveBets()) { BETS.pop(); msg.textContent = 'Nu am putut salva: stocarea telefonului e plină.'; return; }
    ['#bev', '#bsel', '#bod', '#bst'].forEach(x => { $(x).value = ''; });
    const bm = $('#bm'); if (bm) { bm.value = ''; $('#bpk').hidden = true; $('#bpk').innerHTML = ''; }
    draft = newDraft(); hint();
    msg.textContent = 'Salvat.';
    drawLists();
  });
  $('#blist').addEventListener('click', e => { const t = e.target.closest('[data-bet]'); if (t) openBet(t.dataset.bet, drawLists); });
  restoreScroll();
}

function openSheet(html) { const s = $('#sheet'); $('#shin').innerHTML = html; s.hidden = false; document.body.style.overflow = 'hidden'; }
function closeSheet() {
  const s = $('#sheet');
  if (!s || s.hidden) return;
  s.hidden = true; $('#shin').innerHTML = ''; document.body.style.overflow = '';
  if (needsRender) { needsRender = false; setTimeout(() => route({ keep: true }), 0); }
}
function openSettings() {
  const th = [['auto', 'Automat'], ['light', 'Luminoasă'], ['dark', 'Întunecată']];
  openSheet(`<div class="sh-top"><h2 id="sht">Setări</h2><button class="ico" type="button" data-act="close" aria-label="Închide">${ICON.x}</button></div>
    <div class="field"><span>Meciuri analizate</span>${nSeg()}</div>
    <div class="field"><span>Temă</span><div class="seg sm" role="group" aria-label="Temă">${th.map(([k, l]) => `<button type="button" data-th="${k}" aria-pressed="${settings.theme === k}">${l}</button>`).join('')}</div></div>
    <label class="field col"><span>Proxy pentru cereri (opțional)</span><input type="url" id="px" value="${esc(settings.proxy)}" placeholder="https://proxy-ul-tău/?url=" autocomplete="off" autocapitalize="off"><span class="note" style="margin:0">Lasă gol. Completează doar dacă rețeaua ta blochează ESPN și ai un proxy propriu; URL-ul cererii se adaugă la final.</span></label>
    <div class="acts"><button class="btn" type="button" id="clr">Golește datele din cache</button></div>
    <details><summary>Jurnal tehnic (${LOG.length})</summary><div class="log">${LOG.length ? LOG.map(esc).join('\n') : 'Nicio eroare de rețea.'}</div></details>
    <p class="note">Date live din API-ul public ESPN (fără cheie), structurat după documentația comunitară de pe GitHub; Liga 1, Liga 2 și Cupa României vin de la 365Scores, la fel și cotele (ca rezervă, cele din ESPN); aplicația le folosește doar în calcul, nu le afișează și nu trimite către case de pariuri. În fila Jucători, foile de joc și loturile vin de la ESPN, formațiile probabile, indisponibilii și antrenorii de la 365Scores, valorile de piață de la Transfermarkt (completate din Sofascore și 365Scores), iar mediile arbitrului din meciurile lui din sezon, de la Sofascore. În fila Clasament, clasamentul e cel oficial (ESPN, pentru competițiile românești 365Scores), iar forma, clasamentele acasă/deplasare și statisticile pe echipe sunt calculate din meciurile sezonului. Căutare cu Fuse.js, nume de țări din i18n-iso-countries. Favoritele, pronosticurile, pariurile notate în jurnal și ce învață modelul rămân doar pe acest dispozitiv.</p>`);
  $('#shin').setAttribute('aria-labelledby', 'sht');
  $('#px').addEventListener('change', e => { settings.proxy = e.target.value.trim(); saveSettings(); MEM.clear(); });
  $('#clr').addEventListener('click', e => { store.clearCache(); MEM.clear(); ONCE.clear(); IDXP = null; for (const o of [STATS, BOX, REFS.m, REFS.n, AP, SOFA.e, SOFA.c, SOFA.u, SOFA.t, TMC, TBL]) for (const k of Object.keys(o)) delete o[k]; e.target.textContent = 'Cache golit'; });
}
function openCompare(id) {
  const t = TEAMS.get(id) || { name: 'echipa' };
  openSheet(`<div class="sh-top"><h2 id="sht">Compară ${esc(t.name)} cu…</h2><button class="ico" type="button" data-act="close" aria-label="Închide">${ICON.x}</button></div>
    <div class="search" style="padding-top:6px"><input type="search" id="cq" placeholder="Caută adversarul" autocomplete="off" autocapitalize="off" spellcheck="false" aria-label="Caută adversarul"></div><div id="cres"></div>
    <p class="note">${esc(t.name)} va fi considerată gazdă; poți inversa după.</p>`);
  $('#shin').setAttribute('aria-labelledby', 'sht');
  wireSearch($('#cq'), $('#cres'), o => `#/vs/${encodeURIComponent(id)}/${encodeURIComponent(o.id)}`);
  setTimeout(() => $('#cq')?.focus(), 50);
}

addEventListener('visibilitychange', () => {
  if (document.visibilityState !== 'visible') return;
  const h = location.hash;
  if (/^#?\/?(zi\/0)?$/.test(h) || (h.startsWith('#/m/') && EV.get(h.split('/')[3])?.state === 'in')) route({ keep: true });
});
matchMedia('(prefers-color-scheme: dark)').addEventListener?.('change', () => { if (settings.theme === 'auto') route({ keep: true }); });
route();
setTimeout(() => { resolvePending(15).then(n => { if (n && location.hash === '#/model') route({ keep: true }); }, () => {}); }, 5000);
</script>
